<section id="organizations" class="py-20 bg-gray-50 scroll-mt-20">
  <div class="container mx-auto px-6">
    <div class="text-center mb-12">
      <span
        class="inline-block text-blue-600 font-semibold text-sm uppercase tracking-wider mb-2"
        >Our Partners</span
      >
      <h2 class="text-4xl lg:text-5xl font-bold text-gray-900 mb-4">
        Organizations We've Worked With
      </h2>
      <p class="text-gray-600 text-lg max-w-2xl mx-auto">
        Trusted partners in our mission to transform communities
      </p>
    </div>

    <div class="relative overflow-hidden py-8">
      <div
        class="flex items-center gap-16 opacity-70 hover:opacity-100 transition-opacity duration-300"
        style="width: 200%; animation: marquee 30s linear infinite"
      >
        <div class="flex items-center gap-16 md:w-full w-1/2">
          {% for partner in partners %}
          <img
            src="{{partner.logo.url}}"
            alt="{{partner.name}}"
            class="h-16 w-auto filter grayscale hover:grayscale-0 transition-all duration-300"
          />
          {% endfor %}
        </div>
        <div class="flex items-center gap-16 md:w-full w-1/2">
          {% for partner in partners %}
          <img
            src="{{partner.logo.url}}"
            alt="{{partner.name}}"
            class="h-16 w-auto filter grayscale hover:grayscale-0 transition-all duration-300"
          />
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</section>
