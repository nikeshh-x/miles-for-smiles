{% load static %}
<section
  id="team"
  class="py-20 bg-linear-to-br from-gray-50 to-blue-50/30 scroll-mt-20"
>
  <div class="container mx-auto px-6">
    <div class="text-center mb-16">
      <span
        class="inline-block text-blue-600 font-semibold text-sm uppercase tracking-wider mb-2"
        >Our Heroes</span
      >
      <h2 class="text-4xl lg:text-5xl font-bold text-gray-900 mb-4">
        Meet Our Team
      </h2>
      <p class="text-gray-600 text-lg max-w-2xl mx-auto">
        Dedicated professionals and volunteers making a difference in
        communities
      </p>
    </div>

    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-8">
      {% for team in teams %}
      <!-- Team Card -->
      <div class="group">
        <div
          class="relative bg-white rounded-2xl shadow-lg hover:shadow-2xl transition-all duration-300 overflow-hidden"
        >
          <div
            class="absolute inset-0 bg-linear-to-br from-blue-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"
          ></div>
          <div class="p-8 text-center relative">
            <div class="relative inline-block mb-6">
              <img
                src="{{ team.photo.url }}"
                alt="Dr. Arunima Mandzr"
                class="h-32 w-32 rounded-full mx-auto object-cover border-4 border-white shadow-xl group-hover:scale-110 transition-transform duration-300"
              />
              <div
                class="absolute -bottom-2 -right-2 w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center"
              >
                <i class="fa-solid fa-star text-white text-sm"></i>
              </div>
            </div>
            <h3 class="text-xl font-bold text-gray-900 mb-1">
              {{team.name}}
            </h3>
            <p class="text-blue-600 font-medium mb-4">{{team.role}}</p>
            <div class="flex items-center justify-center gap-3">
              <a
                href=""
                class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center hover:bg-blue-600 hover:text-white transition-all duration-300"
              >
                <i class="fa-brands fa-linkedin"></i>
              </a>
              <a
                href="#"
                class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center hover:bg-blue-600 hover:text-white transition-all duration-300"
              >
                <i class="fa-brands fa-twitter"></i>
              </a>
              <a
                href="#"
                class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center hover:bg-blue-600 hover:text-white transition-all duration-300"
              >
                <i class="fa-brands fa-facebook"></i>
              </a>
            </div>
          </div>
        </div>
      </div>
      {% endfor %}
