<section id="events" class="py-20 bg-white scroll-mt-20">
  <div class="container mx-auto px-6">
    <div class="text-center mb-16">
      <span class="inline-block text-blue-600 font-semibold text-sm uppercase tracking-wider mb-2">What's Coming</span>
      <h2 class="text-4xl lg:text-5xl font-bold text-gray-900 mb-4">
        Upcoming Events
      </h2>
      <p class="text-gray-600 text-lg max-w-2xl mx-auto">
        Join us in our upcoming dental camps and community outreach programs
      </p>
    </div>

    <div class="grid md:grid-cols-3 gap-8">
      <!-- Event Card -->
      {% for event in events %}
      <div
        class="group relative overflow-hidden rounded-2xl border-2 border-gray-100 bg-white hover:border-blue-500 hover:shadow-2xl transition-all duration-300">
        
        <div class="p-8">
          <div
            class="inline-flex items-center gap-2 bg-blue-100 text-blue-700 px-4 py-2 rounded-full text-sm font-semibold mb-4">
            <i class="fa-solid fa-calendar"></i>
            {{ event.start_date|date:"M d, Y" }} 
          </div>
          <h3 class="text-2xl font-bold text-gray-900 mb-3 group-hover:blue-600 transition-colors">
            {{event.title}}
          </h3>
          <p class="text-gray-600 mb-4 flex items-center gap-2">
            <i class="fa-solid fa-location-dot text-blue-600"></i>
            {{event.venue}}
          </p>
          <p class="text-gray-700 leading-relaxed mb-6">
            {{event.description | truncatewords:15}}
          </p>
          <a href="#" class="inline-flex items-center gap-2 text-blue-600 font-semibold hover:gap-3 transition-all">
            Learn More
            <i class="fa-solid fa-arrow-right"></i>
          </a>
        </div>
      </div>
      {% endfor %}

    </div>
    <div class="text-center mt-12">
      <a href="{% url 'events' %}"
        class="inline-flex items-center gap-2 bg-blue-600 text-white px-8 py-4 rounded-xl hover:bg-blue-700 transition-all duration-300 shadow-lg hover:shadow-xl hover:scale-105 font-semibold">
        All Events
        <i class="fa-solid fa-arrow-right"></i>
      </a>
    </div>
  </div>
</section>
